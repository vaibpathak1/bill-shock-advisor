# Local infrastructure. Phase 3a: PostgreSQL (with pgvector) only; the other services
# (Redis, Kafka, Keycloak, MinIO, observability) are added in 3b.
# Usage: cp .env.example .env && docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billshock}
      POSTGRES_USER: ${POSTGRES_USER:-billshock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Docker's default 64 MB /dev/shm broke parallel VACUUM in the Phase 2 EXPLAIN test.
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
