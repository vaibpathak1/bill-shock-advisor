spring:
  application:
    name: bill-shock-advisor
  profiles:
    group:
      # dev and test run against the in-process mock BSS gateways (A-80).
      dev: mock-bss
      test: mock-bss
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway owns the schema
  flyway:
    # Outside dev/test, migrations run as a pre-deploy Kubernetes Job, not at startup
    # (SPEC §6, A-82; Phase 11).
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

billshock:
  tax:
    # GST state codes in which the operator holds a GST registration (A-73, FOR TAX REVIEW).
    # A real operator is usually registered in every state it serves; the seed uses only 27
    # (Maharashtra) so that the IGST path stays covered. Set per environment.
    supplier-state-codes:
      - "27"
    gst-rate: 18.00             # A-72

  catalog:
    # Roaming band per country (A-90). The catalogue prices roaming by band; usage is recorded
    # by country. A roaming country missing here makes the simulator return NOT_SIMULATABLE.
    roaming-bands:
      GCC: [AE, SA, QA, KW, BH, OM]
      WORLD: [US, GB, SG, TH, MY, FR, DE, AU, CA, JP]

  analysis:
    chat:
      # "Meaningful increase" in chat (Q-22, A-83): excess >= Rs 100 AND >= 10% of the
      # 3-bill baseline, on GST-inclusive totals. Separate from billshock.anomaly.* (4b).
      min-excess-inr: 100.00
      min-excess-pct: 10
    simulator:
      max-plan-options: 3       # Q-21

  guardrails:
    # SPEC §4.5; deterministic-core.md §4. Never shown to the LLM. GST-inclusive (Q-20),
    # limits inclusive (A-84).
    autonomy-level: 1           # MVP slice: fixed at Level 1 (ADR-004)
    history-months: 6           # local bill history searched for cited line items (7 bills)
    # Every money-out action (goodwill credit, VAS refund) above this is escalated; none is uncapped.
    money-out-escalate-above-inr: 2000.00
    goodwill:
      auto-approval-max-inr: 500.00
      auto-approval-max-bill-share-pct: 15
      prior-credit-lookback-months: 6

  agent:
    tool-calls:
      # llm-architecture.md §9: 8 counted calls per turn; these two are excluded from the
      # count and allowed once each per turn.
      max-counted-per-turn: 8
      once-per-turn: [escalateToHuman, recordDiagnosis]


  llm:
    # LLM, or TEMPLATE_ONLY: the global kill switch (ADR-005); no key is read then.
    mode: ${BILLSHOCK_LLM_MODE:LLM}
    chat:
      model: claude-sonnet-5          # config, not code (Q-15)
      max-tokens: 1024
      timeout: 30s                    # SDK timeout; maxRetries is fixed at 0 (ADR-008)
      api-key: ${ANTHROPIC_API_KEY_CHAT:}
      # temperature: unset on purpose: Sonnet 5 rejects a non-default value (Q-1)
      # effort / thinking: unset = model default until the 5a live check (T-6)
      max-round-trips: 9              # llm-architecture.md §9
      max-input-tokens-per-call: 30000
      memory-window: 12               # llm-architecture.md §8
    prompt:
      version: v1                     # prompts/system.v1.st; rollback = change this (SPEC §8.3)
      locale: en-IN
      canary: BSA-REF-7Q2K-91XZ       # never in a reply (llm-architecture.md §7)
    pricing:
      # USD per million tokens (A-20, Anthropic pricing page, retrieved 2026-09-25).
      "[claude-sonnet-5]":
        input-per-mtok: 2.00
        cache-write-5m-per-mtok: 2.50
        cache-read-per-mtok: 0.20
        output-per-mtok: 10.00

  cost:
    fx-usd-inr: 88                    # planning rate (A-36)
    max-per-conversation-inr: 45.00   # NFR-09

  security:
    demo-users:
      enabled: false                  # only dev/test (A-97)
