# Integration tests: the datasource comes from Testcontainers (@ServiceConnection).
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

billshock:
  llm:
    mode: LLM
    chat:
      # A fake Anthropic API started by the tests sets billshock.llm.chat.base-url (FakeAnthropicApi).
      api-key: test-key-not-a-secret
      timeout: 3s
  security:
    demo-users:
      enabled: true
      password: test-password-not-a-secret
      users: { cust1001: 1001, cust1002: 1002, cust1003: 1003, cust1004: 1004, cust1005: 1005, cust1006: 1006 }
